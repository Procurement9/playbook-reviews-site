name: Dahl connection check

# This is a connectivity check only. It never generates or publishes content.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Dahl credentials and inference
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: node automation/check-dahl.mjs
