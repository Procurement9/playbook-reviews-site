name: NVIDIA NIM connection check

# Connectivity check only. It never generates, commits, or publishes content.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check configuration before inference
        run: node automation/check-workflow-config.mjs
      - name: Check NVIDIA NIM credentials and inference
        run: node automation/check-nvidia.mjs
