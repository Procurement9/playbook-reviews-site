name: Weekly content (paused for editorial review)

# Automatic publishing is paused because the legacy generator contains fictional
# product examples and unsupported testing claims. This manual status workflow
# does not generate, commit, post or publish content. Re-enable a schedule only
# after a verified, reviewed publishing process has replaced the old generator.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report paused status
        run: echo 'Weekly guide and social publication are paused pending editorial review.'
